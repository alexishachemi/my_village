[tool.poetry]
name = "tileset-app"
version = "0.1.0"
description = ""
authors = ["mathematisse <lucien.pineau@epitech.eu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
PySide6 = "^6.8.0.2"
pydantic = "^2.10.6"


[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
pylint = "^3.3.3"
isort = "^5.13.2"
pyright = "^1.1.392.post0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line_length = 80
target_version = ["py311"]

[tool.isort]
profile = "black"
line_length = 80

[tool.pylint]
max-line-length = 80

[tool.pyright]
pythonVersion = "3.11"
include = ["app"]
exclude = ["**/__pycache__"]
